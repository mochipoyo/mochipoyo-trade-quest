<script>
  (function () {
    function showError(msg) { var box = document.getElementById('fatal'); if (!box) return; box.style.display = 'block'; box.querySelector('.msg').textContent = String(msg); }
    window.addEventListener('error', function (e) { showError(e.message || e); });
    window.addEventListener('unhandledrejection', function (e) { showError((e.reason && e.reason.stack) || e.reason || e); });
    try {
      if (!window.MochiQuest) throw new Error('スクリプトの読み込みに失敗しました（js/ フォルダがリポジトリ直下にあるか確認してください）');
      window.MochiQuest.boot();
    } catch (e) { showError(e.stack || e.message || e); }
  })();
</script>
